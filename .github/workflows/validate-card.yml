name: Validate model card

# The card is checked on every change rather than at deposit time: a malformed header
# is cheaper to find here than halfway through uploading fifteen megabytes.
on:
  push:
    paths: ['MODEL_CARD.md', '.github/workflows/validate-card.yml']
  pull_request:
    paths: ['MODEL_CARD.md']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'htrmopo~=0.5'
      - name: Validate the header against schema v1
        run: |
          python3 - <<'PY'
          import re, yaml, pathlib
          from jsonschema import validate, FormatChecker
          from htrmopo.util import _v1_schema

          text = pathlib.Path("MODEL_CARD.md").read_text(encoding="utf-8")
          m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
          if not m:
              raise SystemExit("::error::MODEL_CARD.md has no YAML header")
          md = yaml.safe_load(m.group(1))

          # id is filled in at deposit time by Zenodo, so it is empty here on purpose.
          md["id"] = md.get("id") or "10.5281/zenodo.0000000"

          validate(md, _v1_schema, format_checker=FormatChecker())
          print("header validates against schema v1")

          # Zenodo renders the card body with a Markdown dialect that knows neither
          # tables nor fenced code blocks: a table comes out as a row of pipes and a
          # fenced block collapses into one line with the language word inside it.
          # The card has to read on the record page, so both are refused here.
          body = text.split("---", 2)[2]
          bad = []
          if any(l.lstrip().startswith("|") for l in body.splitlines()):
              bad.append("a Markdown table — use a bullet list")
          if "```" in body:
              bad.append("a fenced code block — use an inline `code` span")
          if bad:
              raise SystemExit("::error::Zenodo will not render " + "; ".join(bad))
          print("body renders on Zenodo: no tables, no fenced blocks")
          print("fields:", ", ".join(sorted(md)))
          PY
