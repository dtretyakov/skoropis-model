name: Publish to Zenodo

# Manual dispatch only: a deposit cannot be withdrawn, and a stray push must not cause one.
on:
  workflow_dispatch:
    inputs:
      author_name:
        description: 'Override the author in the card, e.g. "Surname, Given name". Leave empty to use the card as committed'
        required: false
        default: ''
      author_orcid:
        description: 'ORCID of the author (optional)'
        required: false
        default: ''
      model:
        description: 'Weights file'
        required: true
        default: 'models/skoropis-12.mlmodel'
      doi:
        description: 'DOI of the previous version — publishes a NEW VERSION beside it. Empty means a first deposit'
        required: false
        default: ''
      listed:
        description: 'Request community inclusion, which makes the model visible to kraken list'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # htrmopo is what kraken itself publishes with; it installs without torch and is small.
      - run: pip install 'htrmopo~=0.5'

      - name: Check the token is set
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "::error::Secret ZENODO_TOKEN is not set. Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      # An override is written into a working copy of the card and never committed.
      - name: Apply the author override
        env:
          AUTHOR_NAME: ${{ inputs.author_name }}
          AUTHOR_ORCID: ${{ inputs.author_orcid }}
        run: |
          if [ -z "$AUTHOR_NAME" ]; then echo "no override, card left as is"; exit 0; fi
          python3 - <<'PY'
          import os, re, yaml, pathlib
          p = pathlib.Path("MODEL_CARD.md")
          text = p.read_text(encoding="utf-8")
          head, body = re.match(r'^---\n(.*?)\n---\n(.*)$', text, re.S).groups()
          md = yaml.safe_load(head)
          author = {"name": os.environ["AUTHOR_NAME"]}
          if os.environ.get("AUTHOR_ORCID"):
              author["orcid"] = os.environ["AUTHOR_ORCID"]
          md["authors"] = [author]
          p.write_text(f"---\n{yaml.dump(md, allow_unicode=True)}---\n{body}", encoding="utf-8")
          print("автор подставлен:", author["name"])
          PY

      - name: Deposit
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          MODEL: ${{ inputs.model }}
          DOI: ${{ inputs.doi }}
          LISTED: ${{ inputs.listed }}
        run: |
          set -o pipefail            # but no set -x: the token is in the arguments
          args=(publish -i MODEL_CARD.md -a "$ZENODO_TOKEN")
          [ -n "$DOI" ] && args+=(-d "$DOI")
          [ "$LISTED" = "true" ] || args+=(-p)
          htrmopo "${args[@]}" "$MODEL" 2>&1 | tee /tmp/out.txt

      - name: Write the DOI into the run summary
        if: always()
        run: |
          {
            echo "## Deposit"
            echo
            if [ -n "${{ inputs.doi }}" ]; then
              echo "New version of record \`${{ inputs.doi }}\`."
            else
              echo "First deposit."
            fi
            echo
            grep -oE '10\.5281/zenodo\.[0-9]+' /tmp/out.txt 2>/dev/null | sort -u | sed 's/^/- DOI: /' || echo "- no DOI found in the output; see the log"
          } >> "$GITHUB_STEP_SUMMARY"
